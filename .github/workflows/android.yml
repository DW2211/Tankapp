# Baut die Android-App (Trusted Web Activity) für den Play Store.
# Ergebnis landet im Branch "android-build":
#   tankbuch-release-unsigned.aab  → wird außerhalb mit dem Upload-Schlüssel signiert (jarsigner)
#   tankbuch-test.apk              → mit dem Debug-Schlüssel signiert, direkt aufs Handy installierbar
name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: SDK-Pakete installieren
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleDebug

      - name: Ergebnis in Branch android-build ablegen
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/out/tankbuch-release-unsigned.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/tankbuch-test.apk
          echo "versionCode=${{ github.run_number }}" > /tmp/out/build-info.txt
          echo "commit=${{ github.sha }}" >> /tmp/out/build-info.txt
          cd /tmp/out
          git init -q -b android-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Android-Build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-build
